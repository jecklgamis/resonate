<svg viewBox="0 0 780 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three entry points (resonate hit, resonate run, and the Go library) all construct a generator.Generator, which internal/engine drives on a schedule, streaming Results into internal/report, which produces four output formats.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <style>
    .box { fill: #fff; stroke: #333; stroke-width: 1.5; }
    .accent { fill: #fef6ec; stroke: #b5651d; stroke-width: 1.5; }
    .out { fill: #f4f4f4; stroke: #333; stroke-width: 1.2; }
    .title { font: 600 13px "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    .sub { font: 11px "Segoe UI", Helvetica, Arial, sans-serif; fill: #444; }
    .label { font: 11px "Segoe UI", Helvetica, Arial, sans-serif; fill: #333; }
    .edge { stroke: #333; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- Row 1: three entry points -->
  <rect class="box" x="20"  y="20" width="220" height="64" rx="6"/>
  <text class="title" x="130" y="46" text-anchor="middle">resonate hit &lt;url&gt;</text>
  <text class="sub"   x="130" y="64" text-anchor="middle">CLI flags (internal/cli)</text>

  <rect class="box" x="280" y="20" width="220" height="64" rx="6"/>
  <text class="title" x="390" y="42" text-anchor="middle">resonate run scenario.yaml</text>
  <text class="sub"   x="390" y="59" text-anchor="middle">internal/cli parses flags,</text>
  <text class="sub"   x="390" y="73" text-anchor="middle">internal/config parses the YAML</text>

  <rect class="box" x="540" y="20" width="220" height="64" rx="6"/>
  <text class="title" x="650" y="42" text-anchor="middle">Go library</text>
  <text class="sub"   x="650" y="59" text-anchor="middle">resonate.NewScenario()...Run()</text>
  <text class="sub"   x="650" y="73" text-anchor="middle">or the struct-literal API directly</text>

  <!-- converge into Generator -->
  <path class="edge" d="M130,84 L130,120 Q130,140 260,140 Q370,140 390,140"/>
  <path class="edge" d="M390,84 L390,140"/>
  <path class="edge" d="M650,84 L650,120 Q650,140 500,140 Q400,140 390,140"/>

  <rect class="accent" x="140" y="148" width="500" height="72" rx="6"/>
  <text class="title" x="390" y="172" text-anchor="middle">internal/generator</text>
  <text class="sub"   x="390" y="189" text-anchor="middle">builds HTTPGenerator / FlowGenerator / WSGenerator</text>
  <text class="sub"   x="390" y="205" text-anchor="middle">— one Generator, Do(ctx, vuID) []Result per iteration</text>

  <!-- Generator -> Engine -->
  <line class="edge" x1="390" y1="220" x2="390" y2="256"/>
  <text class="label" x="404" y="242">a Generator value</text>

  <rect class="box" x="120" y="264" width="540" height="76" rx="6"/>
  <text class="title" x="390" y="288" text-anchor="middle">internal/engine — Run(ctx, gen, Options)</text>
  <text class="sub"   x="390" y="306" text-anchor="middle">runFlat (closed) · runOpenModel (constant-arrival) · runStaged (ramp)</text>
  <text class="sub"   x="390" y="323" text-anchor="middle">worker goroutines call gen.Do() on a schedule at the configured rate/concurrency</text>

  <!-- Engine -> Report -->
  <line class="edge" x1="390" y1="340" x2="390" y2="378"/>
  <text class="label" x="404" y="364">stream of Results</text>

  <rect class="box" x="180" y="386" width="420" height="64" rx="6"/>
  <text class="title" x="390" y="410" text-anchor="middle">internal/report</text>
  <text class="sub"   x="390" y="428" text-anchor="middle">Aggregator.Add(result) per result → Aggregator.Summary()</text>
  <text class="sub"   x="390" y="443" text-anchor="middle">assert.go: Evaluate(assertions) against the Summary</text>

  <!-- Report -> outputs -->
  <line class="edge" x1="390" y1="450" x2="390" y2="486"/>
  <text class="label" x="404" y="472">a Summary</text>

  <rect class="out" x="20"  y="516" width="165" height="50" rx="6"/>
  <text class="title" x="102" y="538" text-anchor="middle" style="font-size:12px">stdout summary</text>
  <text class="sub"   x="102" y="554" text-anchor="middle">text or --json</text>

  <rect class="out" x="205" y="516" width="165" height="50" rx="6"/>
  <text class="title" x="287" y="538" text-anchor="middle" style="font-size:12px">report.html</text>
  <text class="sub"   x="287" y="554" text-anchor="middle">self-contained, inline SVG</text>

  <rect class="out" x="390" y="516" width="165" height="50" rx="6"/>
  <text class="title" x="472" y="538" text-anchor="middle" style="font-size:12px">report.json</text>
  <text class="sub"   x="472" y="554" text-anchor="middle">same Summary, on disk</text>

  <rect class="out" x="575" y="516" width="165" height="50" rx="6"/>
  <text class="title" x="657" y="538" text-anchor="middle" style="font-size:12px">results.jsonl</text>
  <text class="sub"   x="657" y="554" text-anchor="middle">one line per request</text>

  <line class="edge" x1="390" y1="486" x2="102" y2="516"/>
  <line class="edge" x1="390" y1="486" x2="287" y2="516"/>
  <line class="edge" x1="390" y1="486" x2="472" y2="516"/>
  <line class="edge" x1="390" y1="486" x2="657" y2="516"/>

  <text class="sub" x="390" y="590" text-anchor="middle">written after every run, including a failed one — all four, on by default</text>
  <text class="sub" x="390" y="608" text-anchor="middle">internal/tmpl renders {{ }} fields inside internal/generator; internal/engine and internal/report never see raw templates.</text>
</svg>
